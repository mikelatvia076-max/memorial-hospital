<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agnes Memorial Hospital Center</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
    <script src="https://cdn.jsdelivr.net/npm/@emailjs/browser@4/dist/email.min.js"></script>
    <link href="agnes.css" rel="stylesheet">
</head>
<body>
   <section id="loginpage">

      <h1 class="shine-title">WELCOME TO AGNES MEMORIAL HOSPITAL CENTER</h1>
      <img src="kasa.png" id="kasa" width="150px" height="100px" alt="Agnes Memorial logo">

      <div class="info-grid">
         <div class="glass-card">
            <i class="fa-solid fa-bullseye"></i>
            <h2>Our Mission</h2>
            <p>Patient centered health care service</p>
         </div>
         <div class="glass-card">
            <i class="fa-solid fa-heart"></i>
            <h2>Our Motto</h2>
            <p>We listen, we care</p>
         </div>
      </div>

      <div class="portal-buttons">
         <a href="../hosi/hospital-login.html" class="portal-button staff"><i class="fa-solid fa-user-doctor"></i> Go to Hospital Portal</a>
         <a href="../patient/patient-login.html" class="portal-button patient"><i class="fa-solid fa-hospital-user"></i> Go to Patient Portal</a>
      </div>

      <div class="features">
         <div class="feature"><i class="fa-solid fa-calendar-check"></i><span>Easy Appointments</span></div>
         <div class="feature"><i class="fa-solid fa-user-nurse"></i><span>Caring Staff</span></div>
         <div class="feature"><i class="fa-solid fa-flask"></i><span>Laboratory &amp; Pharmacy</span></div>
         <div class="feature"><i class="fa-solid fa-file-medical"></i><span>Medical Records</span></div>
      </div>

      <div class="heartbeat"><i class="fa-solid fa-heart-pulse"></i></div>
      <p class="site-footer">&copy; Agnes Memorial Hospital Center</p>

   </section>

   <script src="steve.js"></script>
</body>
</html>
